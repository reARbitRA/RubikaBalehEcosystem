# ---------------------------------------------------------------------------
# SPEC-FORGE CI workflow.
#
# WHERE THIS MUST LIVE: .github/workflows/ci.yml
# WHY IT IS HERE INSTEAD: the GitHub App used by the agent workspace holds
# `contents: write` but not `workflows: write`, so a push that creates a file
# under .github/workflows/ is rejected by GitHub. Everything else in this
# repository is unaffected.
#
# TO ACTIVATE (human, one step):
#   git mv ops/ci-workflow.yml .github/workflows/ci.yml
# ...or grant the App the `workflows` permission and let an agent do the same.
# Tracked by tasks/OPEN/T-006-branch-protection-and-required-checks.md.
# ---------------------------------------------------------------------------

name: ci

on:
  push:
    branches: [main, "feat/**", "spec/**", "chore/**", "adr/**", "arena/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job names below are the required status checks — see ops/DEPLOY.md §4.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make test

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make typecheck

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make secret-scan

  forge-lint:
    name: forge-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: forge-lint (with ledger rule F8 against the PR base)
        run: |
          if [ -n "${{ github.event.pull_request.base.ref }}" ]; then
            git fetch --no-tags origin "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remote/origin/${{ github.event.pull_request.base.ref }}"
            make forge-lint FORGE_BASE_REF="origin/${{ github.event.pull_request.base.ref }}"
          else
            make forge-lint
          fi
